name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.12' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: python -m py_compile main.py app/engine.py app/gui.py app/cli.py tests/test_engine.py
      - name: Smoke tests
        run: python tests/test_engine.py
      - name: CLI dry run (must not modify anything)
        run: python main.py --cli --dry-run